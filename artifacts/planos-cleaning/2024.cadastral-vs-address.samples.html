<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comparación Catastro vs Dirección</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000; width: 320px;
      background: rgba(19, 26, 33, 0.92); color: #e5eef6; padding: 14px; border-radius: 12px;
      font: 12px/1.45 Georgia, "Times New Roman", serif; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-height: calc(100% - 24px); overflow: auto;
    }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:999px; margin-right:6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">Chequeo Visual</div>
    <div style="margin-bottom:10px">Azul: punto catastral. Naranja: geocodificación IGN. Línea: distancia entre ambos.</div>
    <div id="rows"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const rows = [{"row":"3","legajo":"2","address":"Craviotto Nº 675, 677","cadastralLat":-32.23111639,"cadastralLon":-58.13951611,"addressLat":-32.23130821,"addressLon":-58.13928354,"verification":"verified_close","distanceMeters":"30.55","ncp":"0100010000000576--009--"},{"row":"5","legajo":"4","address":"Bvard Ferrari Nº 399","cadastralLat":-32.2272497,"cadastralLon":-58.1359497,"addressLat":-32.22750812,"addressLon":-58.13592445,"verification":"verified_close","distanceMeters":"28.83","ncp":"0100010000000136--012--"},{"row":"8","legajo":"7","address":"Alvear Nº 97","cadastralLat":-32.22354575,"cadastralLon":-58.14456873,"addressLat":-32.22358632,"addressLon":-58.14482555,"verification":"verified_close","distanceMeters":"24.58","ncp":"0100010000000076--012--"},{"row":"10","legajo":"9","address":"9 de Mayo Nº 289","cadastralLat":-32.23864688,"cadastralLon":-58.15376091,"addressLat":-32.22663807,"addressLon":-58.13676356,"verification":"review_large_gap","distanceMeters":"2083.04","ncp":"0100011020080249--019--"},{"row":"11","legajo":"10","address":"9 de Mayo Nº 283","cadastralLat":-32.23856211,"cadastralLon":-58.1538415,"addressLat":-32.22654807,"addressLon":-58.13685091,"verification":"review_large_gap","distanceMeters":"2082.93","ncp":"0100011020080249--018--"},{"row":"12","legajo":"11","address":"Alvear N° 375","cadastralLat":-32.21942445,"cadastralLon":-58.14863488,"addressLat":-32.21954535,"addressLon":-58.14883507,"verification":"verified_close","distanceMeters":"23.14","ncp":"0100010000000613--008--"},{"row":"14","legajo":"13","address":"Bvard Sanguinetti Nº 436","cadastralLat":-32.22184803,"cadastralLon":-58.15418903,"addressLat":-32.22168641,"addressLon":-58.15394419,"verification":"verified_close","distanceMeters":"29.21","ncp":"0100010000000515--003--"},{"row":"17","legajo":"16","address":"Esteva Berga N° 105 / 107","cadastralLat":-32.22289275,"cadastralLon":-58.13778778,"addressLat":-32.22277651,"addressLon":-58.13772068,"verification":"verified_close","distanceMeters":"14.38","ncp":"0100010000000141--002--"}];
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];
    const rowsEl = document.getElementById('rows');
    rows.forEach((row) => {
      if (!Number.isFinite(row.cadastralLat) || !Number.isFinite(row.cadastralLon) || !Number.isFinite(row.addressLat) || !Number.isFinite(row.addressLon)) {
        return;
      }

      const cadastral = [row.cadastralLat, row.cadastralLon];
      const address = [row.addressLat, row.addressLon];
      bounds.push(cadastral, address);

      L.circleMarker(cadastral, { radius: 7, color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.95, weight: 2 })
        .addTo(map)
        .bindPopup('<b>Catastro</b><br>Fila ' + row.row + '<br>NCP: ' + (row.ncp || '-') + '<br>' + row.address);

      L.circleMarker(address, { radius: 7, color: '#c2410c', fillColor: '#fb923c', fillOpacity: 0.95, weight: 2 })
        .addTo(map)
        .bindPopup('<b>Dirección IGN</b><br>Fila ' + row.row + '<br>' + row.address);

      L.polyline([cadastral, address], { color: '#facc15', weight: 3, dashArray: '8 6' }).addTo(map);

      const block = document.createElement('div');
      block.style.marginBottom = '10px';
      block.innerHTML = '<div><b>Fila ' + row.row + '</b> · legajo ' + row.legajo + '</div>' +
        '<div>' + row.address + '</div>' +
        '<div><span class="swatch" style="background:#2563eb"></span>catastro · <span class="swatch" style="background:#fb923c"></span>dirección</div>' +
        '<div>estado: <b>' + row.verification + '</b></div>' +
        '<div>distancia: <b>' + row.distanceMeters + ' m</b></div>';
      rowsEl.appendChild(block);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    } else {
      map.setView([-32.2236, -58.1436], 13);
    }
  </script>
</body>
</html>
