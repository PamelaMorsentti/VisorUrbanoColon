<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comparación Catastro vs Dirección</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000; width: 320px;
      background: rgba(19, 26, 33, 0.92); color: #e5eef6; padding: 14px; border-radius: 12px;
      font: 12px/1.45 Georgia, "Times New Roman", serif; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-height: calc(100% - 24px); overflow: auto;
    }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:999px; margin-right:6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">Chequeo Visual</div>
    <div style="margin-bottom:10px">Azul: punto catastral. Naranja: geocodificación IGN. Línea: distancia entre ambos.</div>
    <div id="rows"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const rows = [{"row":"7","legajo":"5","address":"9 de Julio N° 68","cadastralLat":-32.29630421,"cadastralLon":-58.24108433,"addressLat":-32.22193581,"addressLon":-58.14144163,"verification":"review_large_gap","distanceMeters":"12496.83","ncp":"0100010190010000--117--"},{"row":"35","legajo":"31","address":"Lavalle N° 122, 122","cadastralLat":-32.30183571,"cadastralLon":-58.21701233,"addressLat":-32.21866998,"addressLon":-58.13884178,"verification":"review_large_gap","distanceMeters":"11812.97","ncp":"0100010190020000--004--"},{"row":"42","legajo":"38","address":"Mitre N° 776","cadastralLat":-32.28127247,"cadastralLon":-58.16310306,"addressLat":-32.23104606,"addressLon":-58.14251078,"verification":"review_large_gap","distanceMeters":"5911.09","ncp":"0100010170040000--028--"},{"row":"59","legajo":"55","address":"Alvear N° 321","cadastralLat":-32.25690669,"cadastralLon":-58.15090294,"addressLat":-32.22040791,"addressLon":-58.14799166,"verification":"review_large_gap","distanceMeters":"4067.71","ncp":"0100010170020000--071--"},{"row":"62","legajo":"58","address":"Bolìvar Nº 435","cadastralLat":-32.29174921,"cadastralLon":-58.22686254,"addressLat":-32.22188062,"addressLon":-58.14252291,"verification":"review_large_gap","distanceMeters":"11102.02","ncp":"0100010190010000--118--"},{"row":"64","legajo":"60","address":"Reibel N° 636","cadastralLat":-32.2671479,"cadastralLon":-58.15160657,"addressLat":-32.2279114,"addressLon":-58.14155477,"verification":"review_large_gap","distanceMeters":"4464.13","ncp":"0100010170030000--059--"},{"row":"84","legajo":"80","address":"Avda. Pte. Perón N° 296","cadastralLat":-32.26745218,"cadastralLon":-58.14953305,"addressLat":-32.22034834,"addressLon":-58.14707988,"verification":"review_large_gap","distanceMeters":"5242.79","ncp":"0100010170030000--072--"},{"row":"88","legajo":"84","address":"12 de Abril N° 850","cadastralLat":-32.22806822,"cadastralLon":-58.14697036,"addressLat":-32.22801726,"addressLon":-58.1475549,"verification":"verified_close","distanceMeters":"55.28","ncp":"0100010000000007--007--"}];
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];
    const rowsEl = document.getElementById('rows');
    rows.forEach((row) => {
      if (!Number.isFinite(row.cadastralLat) || !Number.isFinite(row.cadastralLon) || !Number.isFinite(row.addressLat) || !Number.isFinite(row.addressLon)) {
        return;
      }

      const cadastral = [row.cadastralLat, row.cadastralLon];
      const address = [row.addressLat, row.addressLon];
      bounds.push(cadastral, address);

      L.circleMarker(cadastral, { radius: 7, color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.95, weight: 2 })
        .addTo(map)
        .bindPopup('<b>Catastro</b><br>Fila ' + row.row + '<br>NCP: ' + (row.ncp || '-') + '<br>' + row.address);

      L.circleMarker(address, { radius: 7, color: '#c2410c', fillColor: '#fb923c', fillOpacity: 0.95, weight: 2 })
        .addTo(map)
        .bindPopup('<b>Dirección IGN</b><br>Fila ' + row.row + '<br>' + row.address);

      L.polyline([cadastral, address], { color: '#facc15', weight: 3, dashArray: '8 6' }).addTo(map);

      const block = document.createElement('div');
      block.style.marginBottom = '10px';
      block.innerHTML = '<div><b>Fila ' + row.row + '</b> · legajo ' + row.legajo + '</div>' +
        '<div>' + row.address + '</div>' +
        '<div><span class="swatch" style="background:#2563eb"></span>catastro · <span class="swatch" style="background:#fb923c"></span>dirección</div>' +
        '<div>estado: <b>' + row.verification + '</b></div>' +
        '<div>distancia: <b>' + row.distanceMeters + ' m</b></div>';
      rowsEl.appendChild(block);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    } else {
      map.setView([-32.2236, -58.1436], 13);
    }
  </script>
</body>
</html>
